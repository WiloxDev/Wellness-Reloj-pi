name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependencias (reproducible)
        run: npm ci

      - name: Build + tests + frescura de dist
        run: ./scripts/contract-gate.sh

      - name: La copia de gentle-context-lens cumple el mismo contrato
        run: |
          git clone --depth 1 https://github.com/WiloxDev/gentle-context-lens.git ../gentle-context-lens
          ./scripts/contract-gate.sh ../gentle-context-lens/src/sidebar-dock.ts

      - name: Contrato de composición del sidebar (ADR-0001)
        run: node scripts/check-sidebar-contract.mjs src
