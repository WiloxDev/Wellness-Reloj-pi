name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependencias (reproducible)
        run: npm ci

      - name: Build + tests (tsc && node --test)
        run: npm test

      - name: Contrato de composición del sidebar (ADR-0001)
        run: node scripts/check-sidebar-contract.mjs src
